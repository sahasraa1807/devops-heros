name: Continuous Integration (CI) Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # JOB 1: Test Application (Unit Tests & Quality Assurance)
  # ========================================================
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: |
          echo "Executing test assertions..."
          pytest -v tests/test_calculator.py --junitxml=test-results.xml

      - name: Execute CLI Demonstration Check
        run: |
          echo "Running application smoke test..."
          python app/calculator.py --demo

  # ========================================================
  # JOB 2: Security & Secret Audit (DevSecOps)
  # ========================================================
  security-check:
    name: Security & Secret Leak Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Accidentally Committed Sensitive Files
        run: |
          echo "Scanning workspace for sensitive credentials and keys..."
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" -o -name "id_rsa*" \) | grep -q .; then
            echo "[ERROR] Security check failed: Sensitive file discovered in repository!"
            exit 1
          else
            echo "[SUCCESS] No unencrypted private keys or .env files detected."
          fi

      - name: Verify Secret Context Injection
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Verifying GitHub Secret availability in runner environment..."
          if [ -n "$DEMO_SECRET" ]; then
            echo "[SUCCESS] DEMO_SECRET is configured and safely masked."
          else
            echo "[NOTICE] DEMO_SECRET not configured in repository settings. Using fallback default for CI."
          fi

  # ========================================================
  # JOB 3: Build & Package (Artifact Creation)
  # ========================================================
  build:
    name: Build & Generate Artifact
    runs-on: ubuntu-latest
    needs: [test, security-check]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make Build Script Executable & Run
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Validate Build Outputs
        run: |
          echo "Inspecting packaged build directory:"
          ls -la build/
          echo "Build metadata:"
          cat build/build-info.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build-artifact
          path: build/
          retention-days: 7
